<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RAPOT - Módulo 01: Red Conceptual Interactiva</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="modulo-01.css">
</head>
<body>
    <div class="modulo-01-container">
        <!-- SVG Network Container -->
        <div class="network-wrapper">
            <svg
                id="network-svg"
                class="network-svg"
                viewBox="0 0 1470 780"
                preserveAspectRatio="xMidYMid meet"
            >
                <defs id="svg-defs"></defs>
                <g id="edges-layer"></g>
                <g id="nodes-layer"></g>
            </svg>
        </div>

        <!-- Control Panel -->
        <div class="control-panel">
            <div class="filter-buttons">
                <button class="filter-btn active" data-filter="todos">
                    <i class="fas fa-list"></i> Todos
                </button>
                <button class="filter-btn" data-filter="soporte">
                    <i class="fas fa-link"></i> Soporte
                </button>
                <button class="filter-btn" data-filter="resiliencia">
                    <i class="fas fa-shield"></i> Resiliencia
                </button>
            </div>
        </div>

        <!-- Insight Cards -->
        <div class="insights-panel">
            <div class="insight-card" data-insight="soporte">
                <div class="insight-icon">
                    <i class="fas fa-link"></i>
                </div>
                <div class="insight-content">
                    <h3>Soporte</h3>
                    <p>7 relaciones</p>
                </div>
            </div>

            <div class="insight-card" data-insight="resiliencia">
                <div class="insight-icon">
                    <i class="fas fa-shield"></i>
                </div>
                <div class="insight-content">
                    <h3>Resiliencia</h3>
                    <p>2 relaciones</p>
                </div>
            </div>

            <div class="insight-card" data-insight="hubs">
                <div class="insight-icon">
                    <i class="fas fa-star"></i>
                </div>
                <div class="insight-content">
                    <h3>Hubs</h3>
                    <p>Nodos centrales</p>
                </div>
            </div>

            <div class="insight-card" data-insight="directas">
                <div class="insight-icon">
                    <i class="fas fa-arrow-right"></i>
                </div>
                <div class="insight-content">
                    <h3>Directas</h3>
                    <p>9 relaciones</p>
                </div>
            </div>

            <div class="insight-card" data-insight="all">
                <div class="insight-icon">
                    <i class="fas fa-network-wired"></i>
                </div>
                <div class="insight-content">
                    <h3>Ver toda la red</h3>
                    <p>Restablecer vista</p>
                </div>
            </div>
        </div>

        <!-- Edge Info Panel -->
        <div class="edge-info-panel" id="edge-info-panel">
            <div class="panel-header">
                <h3 id="edge-title">Relación</h3>
                <button class="close-btn" id="close-edge-info">
                    <i class="fas fa-times"></i>
                </button>
            </div>
            <div class="panel-content">
                <div class="edge-type-badge" id="edge-type-badge"></div>
                <p id="edge-description" class="edge-description"></p>
                <div class="edge-reference">
                    <p id="edge-page" class="edge-page"></p>
                    <p id="edge-text" class="edge-text"></p>
                </div>
            </div>
        </div>

        <!-- Relations Table -->
        <div class="relations-table-container" id="relations-table-container">
            <div class="table-header">
                <h3>Matriz de Relaciones</h3>
                <button class="toggle-table-btn" id="toggle-table-btn">
                    <i class="fas fa-chevron-down"></i>
                </button>
            </div>
            <div class="table-content" id="table-content">
                <table class="matrix-table">
                    <thead>
                        <tr>
                            <th>Origen</th>
                            <th>Destino</th>
                            <th>Tipo</th>
                            <th>Descripción</th>
                        </tr>
                    </thead>
                    <tbody id="matrix-tbody"></tbody>
                </table>
            </div>
        </div>
    </div>

    <script src="modulo-01.js"></script>
</body>
</html>

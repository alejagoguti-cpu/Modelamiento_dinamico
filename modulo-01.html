<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Módulo 01: Construir la Red - Sistema RAPOT</title>
    <link rel="stylesheet" href="modulo-01.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>

    <main class="main-container">
        <!-- Barra Superior de Estadísticas -->
        <div class="stats-bar">
            <div class="stat-card">
                <div class="stat-label">Conceptos</div>
                <div class="stat-value" id="stat-concepts">0</div>
                <div class="stat-icon"><i class="fas fa-cube"></i></div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Relaciones</div>
                <div class="stat-value" id="stat-relations">0</div>
                <div class="stat-icon"><i class="fas fa-link"></i></div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Fuentes</div>
                <div class="stat-value" id="stat-sources">POT</div>
                <div class="stat-icon"><i class="fas fa-book"></i></div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Tipos de Relación</div>
                <div class="stat-value" id="stat-types">0</div>
                <div class="stat-icon"><i class="fas fa-sitemap"></i></div>
            </div>
        </div>

        <!-- Contenedor Principal -->
        <div class="content-wrapper">
            <!-- Panel Lateral Izquierdo -->
            <aside class="sidebar-panel">
                <div class="panel-section">
                    <h3>VISTA DE LA RED</h3>
                    <div class="tabs">
                        <button class="tab-btn active">Todos</button>
                        <button class="tab-btn">Conceptos</button>
                        <button class="tab-btn">Relaciones</button>
                    </div>
                </div>

                <div class="panel-section">
                    <h3>TIPOS DE RELACIÓN</h3>
                    <label class="filter-item">
                        <input type="checkbox" checked data-type="soporte">
                        <span class="indicator" style="background: #4ade80;"></span>
                        <span>Soporte</span>
                    </label>
                    <label class="filter-item">
                        <input type="checkbox" checked data-type="resiliencia">
                        <span class="indicator" style="background: #2fd4c8;"></span>
                        <span>Resiliencia</span>
                    </label>
                    <label class="filter-item">
                        <input type="checkbox" checked data-type="indirecta">
                        <span class="indicator" style="background: #a276f2;"></span>
                        <span>Indirecta</span>
                    </label>
                </div>

                <div class="panel-section">
                    <h3>ESTRUCTURAS</h3>
                    <button class="structure-btn active" data-structure="eep">
                        <i class="fas fa-mountain"></i> EEP Ecológica
                        <span class="count">14</span>
                    </button>
                    <button class="structure-btn" data-structure="efs">
                        <i class="fas fa-network-wired"></i> EFS Funcional
                        <span class="count">14</span>
                    </button>
                    <button class="structure-btn" data-structure="ese">
                        <i class="fas fa-chart-line"></i> ESE Socioeconómica
                        <span class="count">10</span>
                    </button>
                    <button class="structure-btn" data-structure="eip">
                        <i class="fas fa-landmark"></i> EIP Patrimonios
                        <span class="count">10</span>
                    </button>
                    <button class="structure-btn" data-structure="integracion">
                        <i class="fas fa-project-diagram"></i> Integración
                        <span class="count">8</span>
                    </button>
                </div>
            </aside>

            <!-- Área Central con Red -->
            <div class="network-area">
                <div class="network-header">
                    <div>
                        <h2 id="structure-title">Estructura Ecológica Principal</h2>
                        <p id="structure-subtitle">Nodos: 14 // Relaciones: 13</p>
                    </div>
                    <div class="header-actions">
                        <button class="action-btn"><i class="fas fa-download"></i></button>
                        <button class="action-btn"><i class="fas fa-share-alt"></i></button>
                    </div>
                </div>

                <div id="network-container" class="network-wrapper">
                    <!-- SVG generado dinámicamente -->
                </div>

                <!-- Leyenda Flotante -->
                <div class="legend-box">
                    <label>
                        <input type="checkbox" checked id="toggle-nodes">
                        <span>Mostrar Nodos</span>
                    </label>
                    <label>
                        <input type="checkbox" checked id="toggle-edges">
                        <span>Mostrar Conexiones</span>
                    </label>
                </div>
            </div>
        </div>
    </main>

    <script src="modulo-01.js"></script>
</body>
</html>

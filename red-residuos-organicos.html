<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ausencia de gestión de residuos orgánicos — Corabastos (3D)</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f4f6f8; --node:#2454c9; --node-light:#5c85e6;
    --panel:rgba(0,0,0,.04); --panel-border:rgba(0,0,0,.1);
    --ink-dark:#1c2430; --ink-dim:#5b6675;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;margin:0;}
  body{ background:var(--bg); color:var(--ink-dark); font-family:'Inter',sans-serif; overflow:hidden; }
  .intro{
    position:fixed; top:24px; left:50%; transform:translateX(-50%); z-index:6; text-align:center;
    pointer-events:none; max-width:560px; transition:opacity .4s ease;
  }
  .intro h1{ font-family:'Space Grotesk',sans-serif; font-size:16px; font-weight:600; margin:0 0 4px; }
  .intro p{ margin:0; font-size:12px; color:var(--ink-dim); }

  #stage{ position:fixed; inset:0; cursor:grab; }
  #stage:active{ cursor:grabbing; }

  .label-layer{ position:fixed; inset:0; pointer-events:none; z-index:3; }
  .label3d{
    position:absolute; top:0; left:0; transform:translate(-50%,-50%);
    text-align:center; font-weight:600; line-height:1.25; color:#fff;
    padding:0 8px; pointer-events:none; text-shadow:0 1px 3px rgba(0,0,0,.35);
  }
  .label3d.center-label{ font-family:'Space Grotesk',sans-serif; font-size:15px; }
  .label3d.child-label{ font-size:11.5px; }

  .panel{
    position:fixed; top:0; right:0; bottom:0; z-index:10; width:min(360px,92vw);
    background:#fff; border-left:1px solid var(--panel-border); box-shadow:-14px 0 40px rgba(0,0,0,.08);
    padding:26px 24px; overflow-y:auto; transform:translateX(100%); transition:transform .32s cubic-bezier(.2,.8,.2,1);
  }
  .panel.open{ transform:translateX(0); }
  .panel-close{
    position:absolute; top:18px; right:18px; width:30px; height:30px; border-radius:50%; border:1px solid var(--panel-border);
    background:var(--panel); color:var(--ink-dim); display:flex; align-items:center; justify-content:center; cursor:pointer; font-size:14px;
  }
  .panel-close:hover{ background:rgba(0,0,0,.08); }
  .panel-kind{ font-size:11px; text-transform:uppercase; letter-spacing:.06em; color:var(--ink-dim); margin:0 0 8px; }
  .panel h2{ font-family:'Space Grotesk',sans-serif; font-size:16.5px; font-weight:600; margin:0 30px 4px 0; line-height:1.4; }
  .panel .block{ margin-top:16px; padding-top:16px; border-top:1px solid var(--panel-border); }
  .panel .block b{ display:block; font-size:11px; color:var(--ink-dim); font-weight:600; margin-bottom:7px; text-transform:uppercase; letter-spacing:.04em; }
  .panel .rel-chip{ display:block; padding:9px 12px; margin-bottom:7px; border-radius:9px; background:rgba(36,84,201,.08); border:1px solid rgba(36,84,201,.3); font-size:12.5px; cursor:pointer; color:var(--ink-dark); }
  .panel .rel-chip:hover{ background:rgba(36,84,201,.15); }

  .back-btn{
    position:fixed; bottom:22px; left:50%; transform:translateX(-50%); z-index:6;
    padding:10px 18px; border-radius:999px; border:1px solid var(--panel-border); background:#fff;
    font-size:12.5px; font-weight:600; color:var(--ink-dark); cursor:pointer; box-shadow:0 6px 16px rgba(0,0,0,.08);
    opacity:0; pointer-events:none; transition:opacity .3s ease;
  }
  .back-btn.show{ opacity:1; pointer-events:auto; }
  .hint3d{
    position:fixed; bottom:22px; right:22px; z-index:6; font-size:11px; color:var(--ink-dim);
    background:#fff; border:1px solid var(--panel-border); border-radius:999px; padding:8px 14px;
  }
</style>
</head>
<body>

<div class="intro" id="intro">
  <h1>Ausencia de un modelo de gestión y tratamiento de residuos orgánicos</h1>
  <p>Toca la esfera para revelar la red de causas — arrastra para rotar en 3D</p>
</div>

<div id="stage"></div>
<div class="label-layer" id="labelLayer"></div>
<div class="hint3d">🖱️ Arrastra para rotar · rueda para acercar</div>
<button class="back-btn" id="backBtn">← Volver a la esfera inicial</button>

<aside class="panel" id="panel">
  <button class="panel-close" id="panelClose">✕</button>
  <div id="panelBody"></div>
</aside>

<script type="importmap">
{ "imports": {
  "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
  "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
} }
</script>
<script type="module">
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";

const CAUSAS = [
  { id:1, corto:"Sin infraestructura distrital", full:"Insuficiencia de redes de servicios públicos e infraestructura distrital especializada en la recolección diferenciada de residuos húmedos a gran escala." },
  { id:2, corto:"Sin acopio interno", full:"Inexistencia de áreas logísticas internas de acopio y separación temporal de biomasa dentro de los predios comerciales mayoristas." },
  { id:3, corto:"Comercio sobre saneamiento", full:"Supeditación absoluta de la morfología arquitectónica privada al rendimiento comercial bruto, suprimiendo los espacios dedicados al saneamiento y mantenimiento de cargas." },
  { id:4, corto:"Vacío normativo urbano", full:"Carencia de lineamientos de control normativo y exigencias urbanísticas locales para el tratamiento interno de subproductos en el suelo comercial." },
  { id:5, corto:"Desarticulación institucional", full:"Desarticulación entre las políticas de distribución alimentaria regional y la capacidad de soporte de los servicios de aseo urbano en el borde de la localidad." },
];
const REL = [ {from:5,to:1}, {from:5,to:4}, {from:4,to:3}, {from:3,to:2}, {from:1,to:2} ];
const byId = {}; CAUSAS.forEach(c => byId[c.id] = c);

const stageEl = document.getElementById("stage");
const labelLayer = document.getElementById("labelLayer");
const intro = document.getElementById("intro");
const backBtn = document.getElementById("backBtn");

// ---------- Escena 3D ----------
const scene = new THREE.Scene();
scene.background = new THREE.Color(0xf4f6f8);

const camera = new THREE.PerspectiveCamera(50, window.innerWidth/window.innerHeight, 0.1, 100);
camera.position.set(0, 0, 13);

const renderer = new THREE.WebGLRenderer({ antialias:true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
stageEl.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.minDistance = 5; controls.maxDistance = 24;

scene.add(new THREE.AmbientLight(0xffffff, 0.65));
const key = new THREE.DirectionalLight(0xffffff, 0.9); key.position.set(5,8,6); scene.add(key);
const rim = new THREE.DirectionalLight(0x88aaff, 0.35); rim.position.set(-6,-4,-5); scene.add(rim);

const NODE_COLOR = 0x2454c9;
const NODE_COLOR_LIGHT = 0x5c85e6;

function makeSphere(radius, color) {
  const geo = new THREE.SphereGeometry(radius, 48, 32);
  const mat = new THREE.MeshStandardMaterial({ color, roughness:0.35, metalness:0.08 });
  return new THREE.Mesh(geo, mat);
}

// Esfera inicial
const CENTER_R = 2.4;
const centerMesh = makeSphere(CENTER_R, NODE_COLOR);
scene.add(centerMesh);

// 5 esferas de causas, distribuidas en el espacio 3D (no en un plano
// plano: alternan un poco en Z para que la rotación se sienta real).
const NODE_R = 1.15;
const nodePos3D = {};
CAUSAS.forEach((c, i) => {
  const angle = (i / CAUSAS.length) * Math.PI * 2;
  const R = 4.6;
  nodePos3D[c.id] = new THREE.Vector3(
    Math.cos(angle) * R,
    Math.sin(angle) * R * 0.72,
    (i % 2 === 0 ? 1 : -1) * 1.5
  );
});
const nodeMeshes = {};
CAUSAS.forEach(c => {
  const m = makeSphere(NODE_R, NODE_COLOR_LIGHT);
  m.position.set(0,0,0); // nacen en el centro, luego viajan
  m.scale.setScalar(0.001);
  m.visible = false;
  m.userData.causaId = c.id;
  scene.add(m);
  nodeMeshes[c.id] = m;
});

// Conexiones: un cono truncado (cilindro con radios distintos) entre cada
// par de causas segun REL, ancho junto al origen y afinado al destino.
const linkMeshes = [];
REL.forEach(r => {
  const geo = new THREE.CylinderGeometry(0.16, 0.42, 1, 20, 1, true);
  const mat = new THREE.MeshStandardMaterial({ color: NODE_COLOR, roughness:0.4, transparent:true, opacity:0 });
  const mesh = new THREE.Mesh(geo, mat);
  mesh.visible = false;
  scene.add(mesh);
  linkMeshes.push({ mesh, rel:r });
});

function orientLink(mesh, a, b) {
  const dir = new THREE.Vector3().subVectors(b, a);
  const len = dir.length();
  const mid = new THREE.Vector3().addVectors(a, b).multiplyScalar(0.5);
  mesh.position.copy(mid);
  mesh.scale.set(1, len, 1);
  const up = new THREE.Vector3(0,1,0);
  const quat = new THREE.Quaternion().setFromUnitVectors(up, dir.clone().normalize());
  mesh.quaternion.copy(quat);
}

// ---------- Etiquetas HTML proyectadas sobre cada esfera ----------
const centerLabel = document.createElement("div");
centerLabel.className = "label3d center-label";
centerLabel.style.width = "220px";
centerLabel.textContent = "Ausencia de gestión de residuos orgánicos";
labelLayer.appendChild(centerLabel);

const nodeLabels = {};
CAUSAS.forEach(c => {
  const l = document.createElement("div");
  l.className = "label3d child-label";
  l.style.width = "140px";
  l.textContent = c.corto;
  l.style.opacity = "0";
  labelLayer.appendChild(l);
  nodeLabels[c.id] = l;
});

function project(vec3) {
  const p = vec3.clone().project(camera);
  return { x: (p.x*0.5+0.5)*window.innerWidth, y: (-p.y*0.5+0.5)*window.innerHeight, behind: p.z > 1 };
}

// ---------- Interacción: clic para revelar / clic en causa para panel ----------
let revealed = false;
const raycaster = new THREE.Raycaster();
const mouse = new THREE.Vector2();
let downPos = null;

renderer.domElement.addEventListener("pointerdown", (e) => { downPos = { x:e.clientX, y:e.clientY }; });
renderer.domElement.addEventListener("pointerup", (e) => {
  if (!downPos) return;
  const moved = Math.hypot(e.clientX-downPos.x, e.clientY-downPos.y);
  downPos = null;
  if (moved > 6) return; // fue un arrastre de rotacion, no un clic
  mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
  mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
  raycaster.setFromCamera(mouse, camera);
  if (!revealed) {
    const hit = raycaster.intersectObject(centerMesh)[0];
    if (hit) reveal();
    return;
  }
  const hits = raycaster.intersectObjects(Object.values(nodeMeshes));
  if (hits[0]) openPanel(hits[0].object.userData.causaId);
});

function reveal() {
  revealed = true;
  intro.style.opacity = "0";
  backBtn.classList.add("show");
  animateTo(1, 1200);
}
function collapse() {
  revealed = false;
  intro.style.opacity = "1";
  backBtn.classList.remove("show");
  document.getElementById("panel").classList.remove("open");
  animateTo(0, 1000);
}
backBtn.addEventListener("click", collapse);

// t=0 estado colapsado (solo esfera central), t=1 estado revelado (red)
let animT = 0, animFrom = 0, animTo = 0, animStart = 0, animDur = 1000;
function animateTo(target, dur) {
  animFrom = animT; animTo = target; animStart = performance.now(); animDur = dur;
}
function easeOutCubic(x){ return 1 - Math.pow(1-x, 3); }

function applyState() {
  const t = animT;
  centerMesh.scale.setScalar(THREE.MathUtils.lerp(1, 0.001, t));
  centerMesh.material.opacity = 1; centerMesh.material.transparent = t > 0;
  centerMesh.visible = t < 0.999;

  CAUSAS.forEach(c => {
    const m = nodeMeshes[c.id];
    m.visible = t > 0.001;
    m.scale.setScalar(THREE.MathUtils.lerp(0.001, 1, t));
    m.position.lerpVectors(new THREE.Vector3(0,0,0), nodePos3D[c.id], t);
  });

  linkMeshes.forEach(({mesh, rel}) => {
    const a = new THREE.Vector3().lerpVectors(new THREE.Vector3(0,0,0), nodePos3D[rel.from], t);
    const b = new THREE.Vector3().lerpVectors(new THREE.Vector3(0,0,0), nodePos3D[rel.to], t);
    orientLink(mesh, a, b);
    mesh.visible = t > 0.001;
    mesh.material.opacity = t;
  });
}

function openPanel(id) {
  const c = byId[id];
  const panel = document.getElementById("panel"), body = document.getElementById("panelBody");
  const causaDe = REL.filter(r => r.to === id).map(r => byId[r.from]);
  const provoca = REL.filter(r => r.from === id).map(r => byId[r.to]);
  body.innerHTML = `
    <p class="panel-kind">Causa</p>
    <h2>${c.full}</h2>
    ${causaDe.length ? `<div class="block"><b>Viene de</b>${causaDe.map(x => `<div class="rel-chip" data-goto="${x.id}">${x.corto}</div>`).join("")}</div>` : ""}
    ${provoca.length ? `<div class="block"><b>Alimenta a</b>${provoca.map(x => `<div class="rel-chip" data-goto="${x.id}">${x.corto}</div>`).join("")}</div>` : ""}
  `;
  body.querySelectorAll("[data-goto]").forEach(elm => elm.addEventListener("click", (e) => { e.stopPropagation(); openPanel(Number(elm.dataset.goto)); }));
  panel.classList.add("open");
}
document.getElementById("panelClose").addEventListener("click", () => document.getElementById("panel").classList.remove("open"));

window.addEventListener("resize", () => {
  camera.aspect = window.innerWidth/window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

function tick(now) {
  requestAnimationFrame(tick);
  if (animT !== animTo) {
    const p = Math.min(1, (now - animStart) / animDur);
    animT = animFrom + (animTo - animFrom) * easeOutCubic(p);
    applyState();
  }
  controls.update();
  renderer.render(scene, camera);

  // Proyectar etiquetas
  const cp = project(centerMesh.position);
  centerLabel.style.left = cp.x + "px"; centerLabel.style.top = cp.y + "px";
  centerLabel.style.opacity = (centerMesh.visible && !cp.behind) ? String(1 - animT) : "0";

  CAUSAS.forEach(c => {
    const m = nodeMeshes[c.id];
    const p = project(m.position);
    const el = nodeLabels[c.id];
    el.style.left = p.x + "px"; el.style.top = p.y + "px";
    el.style.opacity = (m.visible && !p.behind) ? String(animT) : "0";
  });
}
applyState();
requestAnimationFrame(tick);
</script>
</body>
</html>
